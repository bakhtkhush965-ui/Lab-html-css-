<html>
<head>
<title>Continental Hotel Reservation Form</title>
<style>
body {background-color: white;}
div {background-color: lightgray; padding: 10px;}
h1 {color: red;}
table {background-color: lightblue;}
</style>
</head>
<body>

<div>
<h1 align="center">Continental Hotel Reservation Form</h1>

<form action="">
<table border="1">
<tr>
<td align="right"><b>Name</b></td>
<td><input type="text" value="Enter your name"></td>
</tr>
<tr>
<td align="right"><b>eMail</b></td>
<td><input type="text" value="info@continental.pk"></td>
</tr>
<tr>
<td align="right"><b>Mobile No</b></td>
<td><input type="text" value="Enter your cell number"></td>
</tr>
<tr>
<td align="right"><b>Arrival Time</b></td>
<td><input type="text" value="Enter your arrival time"></td>
</tr>
<tr>
<td align="right"><b>Departure</b></td>
<td><input type="text"> <input type="text"></td>
</tr>
<tr>
<td align="right"><b>Room Type</b></td>
<td>
<input type="radio" name="room" checked>Single
<input type="radio" name="room">Double<br>
<input type="radio" name="room">Presidential Suite
</td>
</tr>
<tr>
<td align="right"><b>Preferences</b></td>
<td>
<input type="checkbox">Non-Smoking<br>
<input type="checkbox" checked>Internet<br>
<input type="checkbox">Firm Mattress
</td>
</tr>
<tr>
<td align="right"><b>Mode of Payment</b></td>
<td>
<input type="checkbox">Cash
<input type="checkbox">Check<br>
<input type="checkbox" checked>Credit Card
<select>
<option>Select Card</option>
<option>Visa</option>
<option>Master</option>
</select>
</td>
</tr>
<tr>
<td colspan="2" align="center"><input type="submit" value="Send Data"></td>
</tr>
</table>
</form>
</div>

</body>
</html>
